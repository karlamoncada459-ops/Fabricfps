
name: Build Fabric FPS Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi
          mkdir extracted
          unzip "$ZIP_FILE" -d extracted
          BUILD_FILE=$(find extracted -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FabricFpsClient-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
